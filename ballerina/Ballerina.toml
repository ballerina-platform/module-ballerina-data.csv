version = "1.0.0"
path = "../native/build/libs/data.csv-native-1.0.0-SNAPSHOT.jar"

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "constraint-native"
version = "1.7.0"
path = "./lib/constraint-native-1.7.0.jar"
